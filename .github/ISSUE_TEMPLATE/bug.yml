name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page or tool
      description: The URL, for example https://handyweb.ir/fa/tools/base64/
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The tool name, its id, and its privacy mode. The Report a Problem link on a tool page fills this in.
      placeholder: Base64 Encoder & Decoder (base64, local)
  - type: input
    id: version
    attributes:
      label: Release
      description: The release that the site runs. The Report a Problem link on a tool page fills this in.
      placeholder: v1.0.0
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not paste real secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Android 15
