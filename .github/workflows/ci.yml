name: CI

# A pull request to main and a push to main run the checks and the build.
# Nothing deploys from this workflow. Releases are in deploy.yml (launch gate).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token every job gets can read the repository and nothing else. A job that
# needs more asks for it by name.
permissions:
  contents: read

env:
  # The Node and Yarn of the starter kit. The checks run on these, not on what
  # the runner image ships this month. .nvmrc and package.json name the same.
  NODE_VERSION: "24.22.2"
  YARN_VERSION: "1.22.22"

# A superseded pull request run is worth canceling. A run on main is not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate
          yarn --version

      - name: Install the packages
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check the code
        run: bash scripts/ci/test.sh

      - name: Audit the packages
        run: bash scripts/ci/audit-js.sh

      - name: Build the site
        run: bash scripts/ci/build.sh

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Browser Tests (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # One job per Playwright project, so the suite runs in parallel and one
      # browser failing does not hide the results of the others.
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile
            browser: chromium
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate

      - name: Install the packages
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install the browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: yarn playwright install --with-deps "$BROWSER"

      - name: Run the browser tests
        env:
          PROJECT: ${{ matrix.project }}
        run: yarn -s test:e2e --project="$PROJECT"

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  lint:
    name: Lint Scripts & Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the shell scripts
        run: bash scripts/ci/lint.sh

      # actionlint 1.7.12 reads the expressions and runs shellcheck on every
      # `run` block of the workflow.
      - name: Lint the workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color=false

      # zizmor 1.31.1 looks for the ways a workflow leaks a secret or runs
      # attacker text. It reads the advisory list online, so it gets the
      # read-only token of this run.
      - name: Audit the workflows for security faults
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo \
            ghcr.io/zizmorcore/zizmor@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 \
            --no-progress --format plain .github
