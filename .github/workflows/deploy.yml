name: Deploy

# A pushed tag vX.Y.Z on a commit of main runs the checks, builds the site,
# attaches the build to a GitHub release, and deploys it to GitHub Pages.
# A manual run with an older tag deploys that release again (rollback).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, for example v1.0.0"
        required: true
        type: string

# The token every job gets can read the repository and nothing else. A job that
# needs more asks for it by name.
permissions:
  contents: read

env:
  NODE_VERSION: "24.22.2"
  YARN_VERSION: "1.22.22"

# One deploy at a time. A running deploy is never canceled.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Check & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag '$TAG' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      # A release is a commit of main. A tag on any other commit is refused.
      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::The tag '$TAG' is not on a commit of main."
            exit 1
          fi

      - name: Check the version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag is '$TAG' but package.json is '$version'."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate

      - name: Install the packages
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check the code
        run: bash scripts/ci/test.sh

      - name: Audit the packages
        run: bash scripts/ci/audit-js.sh

      - name: Build the site
        run: bash scripts/ci/build.sh

      - name: Pack the build
        run: tar -czf "handyweb-${TAG}.tar.gz" -C apps/web/dist .

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TAG }}
          path: handyweb-${{ env.TAG }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist/

  release:
    name: GitHub Release
    needs: build
    # A rollback reuses an existing release.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.TAG }}

      - name: Create the release
        run: |
          gh release create "$TAG" "handyweb-${TAG}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: production
      url: https://handyweb.ir/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
